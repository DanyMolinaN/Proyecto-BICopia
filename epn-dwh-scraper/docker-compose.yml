services:
  postgres:
    image: postgres:15-alpine
    container_name: epn_dwh_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: epn_dw
      POSTGRES_USER: epn_user
      POSTGRES_PASSWORD: epn_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/stg:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epn_user -d epn_dw"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
